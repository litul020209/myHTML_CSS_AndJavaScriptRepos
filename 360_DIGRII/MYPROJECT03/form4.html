<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>

<form>
    <table align="center" cellpadding="8">

        <tr>
            <th colspan="2">Sign Up</th>
        </tr>

        <tr>
            <td><label for="id1">First Name</label></td>
            <td><input type="text" id="id1" placeholder="Enter First Name" required></td>
        </tr>

        <tr>
            <td><label for="id2">Last Name</label></td>
            <td><input type="text" id="id2" placeholder="Enter Last Name" required></td>
        </tr>

        <tr>
            <td><label for="id3">Screen Name</label></td>
            <td><input type="text" id="id3" placeholder="Enter Screen Name" required></td>
        </tr>

        <tr>
            <td>Date of Birth</td>
            <td>
                <select name="month">
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                    <option>April</option>
                    <option>May</option>
                    <option>June</option>
                </select>

                <select name="day">
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                </select>

                <select name="year">
                    <option>1985</option>
                    <option>1986</option>
                    <option>1987</option>
                    <option>1988</option>
                    <option>1989</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Gender</td>
            <td>
                <input type="radio" name="gender" value="male"> Male
                <input type="radio" name="gender" value="female"> Female
            </td>
        </tr>

        <tr>
            <td>Country</td>
            <td>
                <select name="country">
                    <option>USA</option>
                    <option>India</option>
                    <option>UK</option>
                </select>
            </td>
        </tr>

        <tr>
            <td><label for="id4">E-mail</label></td>
            <td><input type="email" id="id4" placeholder="Enter E-mail"></td>
        </tr>

        <tr>
            <td><label for="id5">Phone</label></td>
            <td><input type="tel" id="id5" placeholder="Enter Phone"></td>
        </tr>

        <tr>
            <td><label for="id6">Password</label></td>
            <td><input type="password" id="id6" placeholder="Enter Password"></td>
        </tr>

        <tr>
            <td><label for="id7">Confirm Password</label></td>
            <td><input type="password" id="id7" placeholder="Confirm Password"></td>
        </tr>

        <tr>
            <td></td>
            <td>
                <input type="checkbox"> I agree to the Terms of Use
            </td>
        </tr>

        <tr>
            <td></td>
            <td>
                <input type="submit" value="Submit">
                <input type="reset" value="Cancel">
            </td>
        </tr>

    </table>
</form>

</body>
</html>
