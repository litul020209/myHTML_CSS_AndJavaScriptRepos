<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign UP</title>
</head>

<body>
    <table  align="center" bgcolor="gray">
        <tr>
            <td><label for="id1">First Name</label></td>
            <td>
                <input type="text" id="id1" name="name1" placeholder="Enter First Name" required />
            </td>
        </tr>
        <tr>
            <td><label for="id2">Last Name</label></td>
            <td>
                <input type="text" id="id2" name="name2" placeholder="Enter Last Name" required />
            </td>
        </tr>
        <tr>
            <td><label for="id3">Screen Name</label></td>
            <td>
                <input type="text" id="id3" name="name3" placeholder="Enter Screen Name" required />
            </td>
        </tr>
        <tr>
            <td><label>Date Of Birth</label></td>
            <td>
            <input type="date" name="name4">
            <!-- <input type="number" name="name5" >
            <input type="number" name="name6"> -->
            </td>
        </tr>
        <tr>
            <td><label>Gender:</label></td>
            <td>
                <input type="radio" name="gender" value="male">Male
                <input type="radio" name="gender" value="female">Female
            </td>
              
        </tr>
        <tr>
            <td><label for="">Country</label></td>
            <td>
                <select name="country">
                <option value="usa">USA</option>
                <option value="india">India</option>
                <option value="uk">UK</option>
                </select>
           </td>
        </tr>
        <tr>
            <td><label for="id4">Email</label></td>
            <td><input type="email" id="id4" placeholder="Enter Your Email"></td>
        </tr>
        <tr>
            <td><label for="id5">Phone Number</label></td>
            <td><input type="tel" placeholder="Enter Your Phone Number"></td>
        </tr>
        <tr>
            <td><label for="id6">Password</label></td>
            <td><input type="password" placeholder="Enter Your Password"></td>
        </tr>
        <tr>
            <td></td>
            <td><input type="checkbox"> I agree the terms and condition</td>
        </tr>
        <tr>
            <td></td>
            <td>
                <input type="submit" value="Submit">
                <input type="reset" value="Cancel">
            </td>
        </tr>
    </table>
</body>

</html>
