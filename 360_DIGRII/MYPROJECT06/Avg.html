    <title>JS Learning</title>
</head>
<body>
    <!-- Avg of 6 number  -->
     <script>
        let a=Number(prompt("Enter a: "));
        let i = 1;
        let sum=0;
        while (i <= a) {
            let b=Number(prompt("Enter b: "));
            sum=sum+b;
            i++;
        }
        const avg=sum/a
        console.log("The Avg is: ",avg)
     </script>


</body>
</html>
