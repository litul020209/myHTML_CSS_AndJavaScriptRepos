    <table  align="center" bgcolor="gray">
        <tr>
            <td><label for="id1">Full Name</label></td>
            <td>
                <input type="text" id="id1" name="name1" placeholder="Enter Your Name" required />
            </td>
        </tr>
        <tr>
            <td><label for="id2">Phone Number</label></td>
            <td><input  id="id2" type="tel" placeholder="Enter Your Phone Number" required></td>
        </tr>
        <tr>
            <td><label for="id3">Pin Code</label></td>
            <td><input type="number" placeholder="Enter Your Area Pin" required></td>
        </tr>
        <tr>
            <td><label for="id4">Email</label></td>
            <td><input type="email" id="id4" placeholder="Enter Your Email"></td>
        </tr>
        <tr>
            <td><label for="id5">User ID</label></td>
            <td><input type="text" pattern="[A-Za-z0-9]+" title="Only letters and numbers allowed" id="id5"></td>
        </tr>
        <tr>
            <td><label for="id6">Password</label></td>
            <td><input type="password" placeholder="Enter Your Password"></td>
        </tr>
        
        <tr>
            <td></td>
            <td>
                <input type="submit" value="register">
                <input type="reset" value="Erase">
            </td>
        </tr>
